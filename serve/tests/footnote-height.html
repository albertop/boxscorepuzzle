<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>footnote block height</title>
<!--
  What the footnote block costs vertically, measured on the real packages at 375px.

  ⚠️ **Rendered with the board's own renderer**, not a copy of it: this page imports `renderFootnotes`
  and `board.css` and puts the result in a 375px box. A page with its own version of the line would
  measure something the product does not have, which this project has done twice and both times the
  judgement would have been made on a board that does not exist.

  §6's height budget was measured when the footnote line was one row of text. It is now cells.
-->
<link rel="stylesheet" href="../ui/phone/fonts.css">
<link rel="stylesheet" href="../ui/phone/tokens.css">
<link rel="stylesheet" href="../ui/phone/board.css">
<style>
  body { font: 13px system-ui; margin: 12px; background: #fff; color: #16181d; }
  .frame { width: 375px; padding: 0 8px; box-sizing: border-box; border: 1px dashed #9aa1ad; margin: 6px 0 14px; }
  table { border-collapse: collapse; font: 12px ui-monospace, monospace; margin-bottom: 14px; }
  th, td { border: 1px solid #d3d7de; padding: 3px 8px; text-align: right; }
  th { background: #f4f6f9; }
  caption { text-align: left; font-weight: 700; padding: 6px 0; }
</style>
<div id="out"></div>
<script type="module">
  import { createGame } from "../engine/game.js";
  import { readPackage } from "../engine/package.js";
  import { renderFootnotes } from "../ui/phone/board.js";

  const out = document.getElementById("out");
  const manifest = await (await fetch("../data/puzzles/manifest.json", { cache: "no-store" })).json();

  const rows = [];
  for (const id of manifest.puzzles) {
    const raw = await (await fetch(`../data/puzzles/${manifest.generation}/${id}.json`)).json();
    const puzzle = readPackage(raw);
    const game = createGame(puzzle);
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.append(renderFootnotes(puzzle, game, () => {}));
    out.append(frame);
    const line = frame.querySelector(".footnotes");
    // ⚠⚠ **v28-P3-01: this counted `.cell`, and the footnote line has not contained one for months.**
    // The count was zero for every package, so the table sorted by a constant and preserved manifest
    // order while its heading said "erased terms" — a column from the retired erasable-footnote UI.
    // The height numbers were right; the variable they were supposed to be explained by was absent, so
    // a tall block read as an unexplained package rather than as one carrying many carriers.
    //
    // What drives the height is how much text wraps: the number of live categories, and within them
    // the number of carriers. Both are counted, and the table sorts by carriers.
    const live = line.querySelectorAll(".term.live");
    const carriers = [...live].reduce(
      (total, term) => total + term.querySelector(".who").textContent.split(",").filter((part) => part.trim()).length,
      0,
    );
    rows.push({
      id: id.slice(0, 8),
      terms: live.length,
      carriers,
      height: Math.round(line.getBoundingClientRect().height),
    });
  }

  const table = document.createElement("table");
  table.innerHTML =
    "<caption>the footnote block at 375px, rendered with the board's own renderer</caption>" +
    "<tr><th>package</th><th>live terms</th><th>carriers</th><th>block height</th>" +
    "<th>share of 812px</th><th>rows of 44px</th></tr>" +
    rows
      .sort((a, b) => a.carriers - b.carriers || a.terms - b.terms)
      .map(
        (r) =>
          `<tr><td>${r.id}</td><td>${r.terms}</td><td>${r.carriers}</td><td>${r.height}px</td>` +
          `<td>${((r.height / 812) * 100).toFixed(0)}%</td><td>${Math.round(r.height / 44)}</td></tr>`,
      )
      .join("");
  out.prepend(table);
  // ⚠️ **Non-vacuity, said on the page rather than left to a reader who trusts a column of zeros.**
  // The defect this replaces was a counter that could only ever return zero, and the page rendered it
  // without complaint. If every package really carries no live term, the sample cannot show the
  // relationship the page exists to show, and that is a fact about the sample worth printing.
  const withTerms = rows.filter((r) => r.terms > 0).length;
  const note = document.createElement("p");
  note.textContent =
    withTerms > 0
      ? `${withTerms} of ${rows.length} packages carry a live footnote term.`
      : `NOTHING TO SEE: none of the ${rows.length} packages carries a live footnote term, so height ` +
        `cannot be related to term count here. Widen the sample before reading this table.`;
  if (withTerms === 0) note.style.color = "crimson";
  out.prepend(note);
  globalThis.__heights = rows;
</script>
