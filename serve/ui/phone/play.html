<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ⚠️⚠️ **Absolute asset paths, and relative ones left this page blank at `/p/<id>`.**
     A page served at more than one address cannot name its own files relatively: `main.js` from
     `/p/409f...` resolves to `/p/main.js`, which is not where it is. The dev server's prefix rewrite
     answered that with `play.html` itself, so the browser was handed HTML where it asked for a module
     and refused it on MIME — **`#app` empty, no stylesheet, a blank screen on the canonical URL.**
     ⚠️ **The route test passed throughout**, because it compared the served bytes against `play.html`
     and they matched. It asked *does this address serve the board page* and never *does the board page
     work here* — a working instrument aimed one question short. `daily.js` made its data path absolute
     for exactly this reason at E1 and the HTML was not carried with it. -->
<link rel="stylesheet" href="/ui/phone/fonts.css">
<!-- Tokens before the rules that spend them: the cascade needs the custom properties defined first. -->
<link rel="stylesheet" href="/ui/phone/tokens.css">
<link rel="stylesheet" href="/ui/phone/board.css">
<!-- ⚠️ **The board moved here from `index.html`, which is now the landing page.**
     `docs/serve-flow.md` §1: every visit lands on the landing page, not only the first, because the
     archive, the streak and the subscription live there and a player routed past it would never meet
     any of them. The board keeps `?p=` and `?test=` exactly as before. -->
<div id="app"></div>
<script type="module" src="/ui/phone/main.js"></script>
