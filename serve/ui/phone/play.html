<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <!-- The declarative head. STATIC, and that is the whole point: `applyHead` sets the same
         strings at runtime, and a crawler that does not execute scripts sees none of it. The
         catalogue is still the source; `forge/tests/test_every_page_declares_itself.py` asserts
         these match it, so this is two places with something checking rather than two places
         drifting. -->
    <title>boxscore puzzle — a daily baseball deduction</title>
    <meta name="description" content="Rebuild today’s real major-league boxscore from the numbers that are left. One puzzle a day.">
    <link rel="canonical" href="https://boxscorepuzzle.com/">
    <!-- noindex, and it is a constraint rather than a difficulty.
         Section 7 forbids the URL naming the teams or the date, which is why the id is opaque; section 9
         sells the archive, which is why only today and yesterday are on a public path at all. An indexed
         /p/<id> would put a permanent, crawlable address on a puzzle that is meant to be one day old and
         then sold. `follow` because the links out of it are the landing page and the tutorial, which are
         exactly what should be indexed. -->
    <meta name="robots" content="noindex, follow">

    <!-- Open Graph. og:image is STATIC BRANDING and never board state (`docs/serve-brief.md`
         section 667): the scraper fetches server-side without the sharer's session, so a
         dynamic image could not show their board even in principle, and section 7's rule that
         the share never leaks the solution extends to a static image trivially and to a
         dynamic one never. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="boxscore puzzle">
    <meta property="og:title" content="boxscore puzzle — a daily baseball deduction">
    <meta property="og:description" content="Rebuild today’s real major-league boxscore from the numbers that are left. One puzzle a day.">
    <meta property="og:url" content="https://boxscorepuzzle.com/">
    <meta property="og:image" content="https://boxscorepuzzle.com/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="boxscore puzzle">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="boxscore puzzle — a daily baseball deduction">
    <meta name="twitter:description" content="Rebuild today’s real major-league boxscore from the numbers that are left. One puzzle a day.">
    <meta name="twitter:image" content="https://boxscorepuzzle.com/og-image.png">

    <!-- The mark. SVG first for a tab that can take it, .ico because a browser asks for it
         whether or not a page names one. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#1f362e">

<!-- ⚠️⚠️ **Absolute asset paths, and relative ones left this page blank at `/p/<id>`.**
     A page served at more than one address cannot name its own files relatively: `main.js` from
     `/p/409f...` resolves to `/p/main.js`, which is not where it is. The dev server's prefix rewrite
     answered that with `play.html` itself, so the browser was handed HTML where it asked for a module
     and refused it on MIME — **`#app` empty, no stylesheet, a blank screen on the canonical URL.**
     ⚠️ **The route test passed throughout**, because it compared the served bytes against `play.html`
     and they matched. It asked *does this address serve the board page* and never *does the board page
     work here* — a working instrument aimed one question short. `daily.js` made its data path absolute
     for exactly this reason at E1 and the HTML was not carried with it. -->
<link rel="stylesheet" href="/ui/phone/fonts.css">
<!-- Tokens before the rules that spend them: the cascade needs the custom properties defined first. -->
<link rel="stylesheet" href="/ui/phone/tokens.css">
<link rel="stylesheet" href="/ui/phone/board.css">
<!-- ⚠️ **The board moved here from `index.html`, which is now the landing page.**
     `docs/serve-flow.md` §1: every visit lands on the landing page, not only the first, because the
     archive, the streak and the subscription live there and a player routed past it would never meet
     any of them. The board keeps `?p=` and `?test=` exactly as before. -->
<div id="app"></div>
<script type="module" src="/ui/phone/main.js"></script>
