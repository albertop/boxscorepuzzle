<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- ⚠️⚠️ **Absolute asset paths, and relative ones left this page blank at `/p/<id>`.**
     A page served at more than one address cannot name its own files relatively: `main.js` from
     `/p/409f...` resolves to `/p/main.js`, which is not where it is. The dev server's prefix rewrite
     answered that with `play.html` itself, so the browser was handed HTML where it asked for a module
     and refused it on MIME — **`#app` empty, no stylesheet, a blank screen on the canonical URL.**
     ⚠️ **The route test passed throughout**, because it compared the served bytes against `play.html`
     and they matched. It asked *does this address serve the board page* and never *does the board page
     work here* — a working instrument aimed one question short. `daily.js` made its data path absolute
     for exactly this reason at E1 and the HTML was not carried with it. -->
    <!--
      /today — the redirect, and it is the whole of C6's second half.

      ⚠️⚠️ **A static page rather than a service, because `/today` is the play path.** §23 forbids a
      backend dependency there: a process answering this address is a process whose failure takes away
      the only door into the game. `publish` is allowed to be an executable precisely because it is not
      here — it runs once a day, writes files and exits, and if it dies the previous day's files still
      serve.

      ⚠️ **So this is not a 302 and that is a known cost.** A real redirect status needs something that
      reads `today.json` per request, or an nginx reload per day. The first is the dependency above; the
      second is a moving part in F. What this gives up is a cacheable redirect and a crawler-friendly
      one, on a page nobody links to twice.

      ⚠️ `noindex`, because the canonical address is `/p/<id>` (C6) and two addresses for one board is
      the duplicate-URL space this route exists to collapse.
    -->
    <meta name="robots" content="noindex" />
    <!-- From the catalogue, not typed here. This page kept a title element with the words spelled in
         after the other three had theirs removed for exactly that reason (C11, v36-P2-17): a
         user-facing string in markup is invisible to every guard that reads `.js`, and the seam's blind
         spot was a file extension. This file was in it.
         `forge/tests/test_every_page_declares_itself.py` asserts it equals the catalogue's. -->
    <title>boxscore puzzle — a daily baseball deduction</title>
    <meta name="description" content="Rebuild today’s real major-league boxscore from the numbers that are left. One puzzle a day." />
    <link rel="canonical" href="https://boxscorepuzzle.com/" />

    <!-- Open Graph. og:image is static branding and never board state (`docs/serve-brief.md` 667). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="boxscore puzzle" />
    <meta property="og:title" content="boxscore puzzle — a daily baseball deduction" />
    <meta property="og:description" content="Rebuild today’s real major-league boxscore from the numbers that are left. One puzzle a day." />
    <meta property="og:url" content="https://boxscorepuzzle.com/" />
    <meta property="og:image" content="https://boxscorepuzzle.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="boxscore puzzle" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="boxscore puzzle — a daily baseball deduction" />
    <meta name="twitter:description" content="Rebuild today’s real major-league boxscore from the numbers that are left. One puzzle a day." />
    <meta name="twitter:image" content="https://boxscorepuzzle.com/og-image.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1f362e" />
    <link rel="stylesheet" href="/ui/phone/tokens.css" />
    <link rel="stylesheet" href="/ui/phone/landing.css" />
  </head>
  <body>
    <main id="today"></main>
    <script type="module" src="/ui/phone/today.js"></script>
  </body>
</html>
