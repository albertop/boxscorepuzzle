# The daily rotation's schedule. **F3.**
#
#     sudo install -D -m 644 deploy/ofelia/rotation.ini /srv/boxscorepuzzle/ofelia/config.ini
#
# ⚠️⚠️ **An INI rather than Docker labels, and the reason is not style.** Ofelia's label mode reads job
# definitions from **running** containers, and this job's container exits by design — so a labelled
# `publish` service would be invisible to the scheduler the moment it did its work. Labels would also
# put the volumes in two places: once in the compose file and once on the label.
#
# It is also the operator's existing convention: `dglweb-scheduler` runs `--config=/etc/ofelia/config.ini`.
#
#
# WHAT IT ROTATES, AND WHY A MISSED RUN MATTERS MORE THAN A FAILED ONE
# --------------------------------------------------------------------
# Section 9 sells the archive and section 23 makes the day's puzzle a static file, and those pull
# opposite ways: a static file on a public path cannot be sold. The resolution is that **only today's
# and yesterday's packages exist on the public path**, and this job is what makes that true.
#
# `rotate()` is built by difference rather than by deleting a remembered third day: it computes the set
# that should be there and removes whatever else it finds. **So a run that has been broken for a week
# repairs the whole week the first time it succeeds** -- which is the property that makes a missed run
# recoverable instead of a permanent leak.
#
#
# THE TIME, AND WHY THIS SCHEDULER RUNS ON UTC
# ---------------------------------------------
# `serving_date()` is `now(UTC) + ROLLOVER_OFFSET_HOURS`, and that offset is -8. So the serving day
# changes at **08:00 UTC**, every day, regardless of where anybody is.
#
# ⚠️⚠️ **The scheduler's TZ is therefore UTC and not America/Santo_Domingo.** With a local zone the
# schedule and the rollover would be written in two different clocks, and every future reader would have
# to convert one to check the other -- and would have to do it again the next time the offset moved.
# Same clock, no conversion, nothing to get wrong.
#
# 08:15 rather than 08:00: fifteen minutes of margin so the job is not racing the boundary it depends on.
# The rotation asks `serving_date()` itself, so a run at 08:15 publishes the day that began at 08:00.
#
# ⚠️ Six fields, not five. Ofelia's cron takes seconds first: `0 15 8 * * *` is 08:15:00.
#
#
# THE VERSION IS SPELLED HERE AND MUST MOVE WITH THE DEPLOY
# ---------------------------------------------------------
# ⚠️⚠️ Ofelia does not interpolate environment variables into this file, so the tag is written out. **A
# deploy that loads a new `bxcpze-publish` and does not edit this line keeps running the old one**, and
# nothing reports it: the rotation still succeeds, still prints, still exits zero -- with last month's
# code. It is the one thing in this deployment that can silently fall behind.
#
# `tools/deploy_bxcpze_publish_image.sh` refuses to finish while this line names a different tag than the
# one it just loaded. **It refuses; it never rewrites.** A load that silently changed what production
# runs is the opposite of a deploy: the image arriving and the host being told to use it are two acts,
# and collapsing them means nobody ever chose the second.
#
# ⚠️ That check covers the script and nothing else. Editing this file by hand, or loading an image
# another way, bypasses it entirely. **It makes forgetting loud on the path used almost every time; it
# does not close the class.**
#
#
# THE OPTION NOT TAKEN, AND WHY -- SO IT IS REVISITED RATHER THAN RE-INVENTED
# ---------------------------------------------------------------------------
# **The only design that closes the class is for the scheduler to START A CONTAINER THE COMPOSE FILE
# DEFINES, instead of creating one from an image named here.** Then `publish`'s version would live in
# `BXCPZE_PUBLISH_VERSION` beside `serve`'s and `keep`'s -- one place, set in Portainer, impossible to
# leave behind because there would be nothing to leave behind.
#
# **It was not taken because of how ofelia finds work.** Its label mode reads job definitions from
# **running** containers, and this job's container exits by design: the moment it does its work it stops
# being visible to the scheduler. A `publish` service that stayed up so it could be labelled would be a
# container that does nothing for 23 hours and 59 minutes, and reads in `docker ps` exactly like a
# healthy service -- while a `restart:` policy on one that exits is an infinite loop that rotates
# hundreds of times a day.
#
# **What it would cost to take it:** either `job-exec` against a long-running container (which means
# inventing that supervisor), or a scheduler that is not ofelia -- a host cron calling
# `docker compose run --rm publish`, which puts the schedule outside the stack and outside anything the
# repository can check. **Neither is obviously better than one line somebody has to edit correctly**, and
# that is the honest summary: the hazard is real, the mitigation is partial, and closing it properly is a
# redesign of how the job is triggered rather than a fix.

[job-run "rotate"]
schedule = 0 15 8 * * *
image = bxcpze-publish:1.2026.1
# ⚠️ Read-only: the rotation reads generations and copies out of them. It never alters one, and `forge`
# on the laptop is the only thing that may.
volume = /srv/boxscorepuzzle/inventory:/srv/inventory:ro
# ⚠️ The named volume the stack creates, spelled with its stack prefix. `serve` publishes from it and
# **this job is its only writer.**
volume = boxscorepuzzle_puzzles:/srv/public
command = --inventory /srv/inventory --public /srv/public
# ⚠️ Otherwise one exited container accumulates per day, for ever, and `docker ps -a` becomes unusable.
delete = true
