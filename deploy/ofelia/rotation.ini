# The daily rotation's schedule. **F3.**
#
#     sudo install -D -m 644 deploy/ofelia/rotation.ini /srv/boxscorepuzzle/ofelia/config.ini
#
# ⚠️⚠️ **An INI rather than Docker labels, and the reason is not style.** Ofelia's label mode reads job
# definitions from **running** containers, and this job's container exits by design — so a labelled
# `publish` service would be invisible to the scheduler the moment it did its work. Labels would also
# put the volumes in two places: once in the compose file and once on the label.
#
# It is also the operator's existing convention: `dglweb-scheduler` runs `--config=/etc/ofelia/config.ini`.
#
#
# WHAT IT ROTATES, AND WHY A MISSED RUN MATTERS MORE THAN A FAILED ONE
# --------------------------------------------------------------------
# Section 9 sells the archive and section 23 makes the day's puzzle a static file, and those pull
# opposite ways: a static file on a public path cannot be sold. The resolution is that **only today's
# and yesterday's packages exist on the public path**, and this job is what makes that true.
#
# `rotate()` is built by difference rather than by deleting a remembered third day: it computes the set
# that should be there and removes whatever else it finds. **So a run that has been broken for a week
# repairs the whole week the first time it succeeds** -- which is the property that makes a missed run
# recoverable instead of a permanent leak.
#
#
# THE TIME, AND WHY THIS SCHEDULER RUNS ON UTC
# ---------------------------------------------
# `serving_date()` is `now(UTC) + ROLLOVER_OFFSET_HOURS`, and that offset is -8. So the serving day
# changes at **08:00 UTC**, every day, regardless of where anybody is.
#
# ⚠️⚠️ **The scheduler's TZ is therefore UTC and not America/Santo_Domingo.** With a local zone the
# schedule and the rollover would be written in two different clocks, and every future reader would have
# to convert one to check the other -- and would have to do it again the next time the offset moved.
# Same clock, no conversion, nothing to get wrong.
#
# 08:15 rather than 08:00: fifteen minutes of margin so the job is not racing the boundary it depends on.
# The rotation asks `serving_date()` itself, so a run at 08:15 publishes the day that began at 08:00.
#
# ⚠️ Six fields, not five. Ofelia's cron takes seconds first: `0 15 8 * * *` is 08:15:00.
#
#
# THE VERSION IS NOT SPELLED HERE, AND IT USED TO BE
# --------------------------------------------------
# ⚠️⚠️ **This section said the opposite until 2026-08-26, in the file that had already stopped doing it.**
# `container = bxcpze-publish` is eighteen lines below, and the heading above it read *the version is
# spelled here and must move with the deploy* while the section after that called the container design
# **"the option not taken"**. Both were true when written and both were false when read -- and the `.sh`,
# the `.ps1` and the runbook all pointed AT THIS FILE as the authority, so one stale explanation was
# being read by three operator-facing paths. v43-P2-01.
#
# **What is true now:** the publisher's version lives in `BXCPZE_PUBLISH_VERSION` in Portainer, beside
# `serve`'s and `keep`'s. Ofelia starts a container `compose.yaml` already declared, so there is no tag
# in this file to fall behind, and nothing for the load script to compare.
#
# ⚠️ **The hazard that argued for the old design is gone rather than mitigated.** It was: ofelia reads no
# environment, so the tag had to be written out, so a deploy that loaded a new image and did not edit
# this line kept running the old one -- successfully, printing normally, exiting zero. The load script
# refused to finish while the two disagreed, which made forgetting loud on one path and closed nothing.
# **There is no second place to forget now.**
#
#
# WHY THE LABEL DESIGN IS STILL NOT USED -- SO IT IS REVISITED RATHER THAN RE-INVENTED
# ------------------------------------------------------------------------------------
# **Ofelia's label mode reads job definitions from RUNNING containers, and this job's container exits by
# design.** A `publish` service that stayed up so it could be labelled would do nothing for 23 hours and
# 59 minutes and read in `docker ps` exactly like a healthy service -- while a `restart:` policy on one
# that exits is an infinite loop that rotates hundreds of times a day.
#
# So the job stays in this INI and names the container. **What that buys is the whole of the fix**: the
# volumes, the command and the network are declared once, in `compose.yaml`, next to the services they
# work with -- and the version with them.
#
# ⚠️ The remaining alternative, recorded so nobody re-derives it: a host cron calling
# `docker compose run --rm publish`, which puts the schedule outside the stack and outside anything the
# repository can check. It is worse for that reason alone.

[job-run "rotate"]
schedule = 0 15 8 * * *
# ⚠️⚠️ **`container`, not `image`, and it took two failures to get here.**
#
# `job-run` with an image ALWAYS pulls -- ofelia 0.3.22 is the latest release and ignores `pull = false`
# -- and every image in this stack is local, because `forge/` never leaves the laptop and nothing is in a
# registry. The pull fails with `repository does not exist`, which reads like a missing image and is the
# opposite: it is there, and ofelia went looking elsewhere.
#
# ⚠️⚠️ **And the second failure was that it WASN'T there.** `publish` ran with `--rm`, so it never had a
# container, so Docker considered its image unused -- and a prune on this shared host took it, silently.
# A daily job whose image any cleanup may reap is not a deployment. **The container in `compose.yaml`
# fixes both**: nothing is pulled, and a stopped container is a reference that keeps the image alive.
#
# ⚠️ The volumes, the command and the network are the container's, declared in `compose.yaml` beside the
# services it works with. Spelling them here as well would be the same thing said in two places.
container = bxcpze-publish
# ⚠️⚠️ **`false`, and `true` would work exactly once.** Deleting the container after the run leaves
# nothing to start tomorrow, and the failure arrives a day later as *no such container*.
delete = false

[job-exec "purge"]
schedule = 0 45 8 * * *
container = bxcpze-keep
command = python -m keep.purge
