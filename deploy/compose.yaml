# The production stack. **One Portainer stack, two services, and the Postgres that already exists.**
#
#     docker compose -f deploy/compose.yaml up -d
#
# ⚠️⚠️ **`name:` is what Portainer shows as the stack**, and it is why the containers appear together:
# compose stamps `com.docker.compose.project` on each one and Portainer groups by that label. Deploying
# this through Portainer's *Stacks → Add stack* with the name `boxscorepuzzle` produces the same
# grouping; the
# `name:` here keeps a command-line deploy identical to a UI one instead of leaving two conventions.
#
# ⚠️ **The test containers are deliberately NOT in this stack.** `docker run` creates no project label,
# so `bxcpze-nginx-…`, `bxcpze-db-…` and friends appear ungrouped and disappear when the suite ends.
# They share the prefix so a stray one is findable; they are not part of the deployment.
#
# ⚠️⚠️ **No Postgres here: the VPS already has one** (`docs/beta-0.md`). `keep` is pointed at it, and
# **the schema is applied by hand before the stack starts** — `data-layer.md` §7: nothing migrates on
# boot, because a deploy that alters the database at three in the morning is the one failure a rollback
# does not undo. `keep` asks the schema version and refuses if it is not what it expects.

# ⚠️ **The stack is `boxscorepuzzle` and the images and containers are `bxcpze-*`, and that is not a
# leftover.** The stack name is what a person reads in Portainer, so it is the product's name; the
# prefix is what a `docker ps --filter name=` sweep matches, so it is short and uncommon enough that it
# cannot hit somebody else's container on a shared VPS. Two audiences, two names, neither derived from
# the other.
#
# ⚠️ **The volume follows the stack**, so it is `boxscorepuzzle_puzzles` and not `bxcpze_puzzles`. A
# rename of the stack orphans the old volume rather than moving it -- the packages in it are two public
# files the rotation rewrites daily, so nothing is lost, but the old one stays on disk until it is
# removed by hand.
name: boxscorepuzzle

services:
  # The site. nginx over the baked `serve/` tree, with the routes and the cache rule.
  serve:
    # ⚠️⚠️ **No `build:` block, and its absence is the rule rather than an omission.** The image is
    # built on the laptop by `tools/create_docker_image.ps1`, saved, transferred, and loaded by
    # `tools/deploy_bxcpze_serve_image.sh`. **A build here would need the repository on the VPS**, and
    # `forge/` must never reach it (CLAUDE.md sections 16 and 33) -- a build context is a copy, even
    # when the resulting image carries only `serve/`.
    #
    # ⚠️ So this file **runs** a stack and never produces one. Portainer redeploying it pulls nothing
    # and builds nothing: it starts what `docker load` already put on the machine, and says so plainly
    # if the tag is absent.
    image: bxcpze-serve:${BXCPZE_SERVE_VERSION:?the version that was loaded, e.g. 1.2026.1}
    container_name: bxcpze-serve
    restart: unless-stopped
    init: true

    environment:
      # ⚠️⚠️ **`:?` and no default.** Compose refuses to start the stack when this is unset rather than
      # substituting an empty string — the config would then send `Authorization: Bearer ` and `keep`
      # would refuse every request, which is a working deployment that quietly drops every event.
      # `docs/signing-keys.md`'s precedent: an exported variable is an instruction, and a default is
      # what reaches production by omission.
      KEEP_SHARED_TOKEN: ${KEEP_SHARED_TOKEN:?set it in the stack's environment; there is no default}
      # Keeps the substitution to that one name, so nginx's own `$host` and `$1` survive it.
      # ⚠️⚠️ **Two names and no more.** `envsubst` would otherwise eat nginx's own `$host`, `$1` and
      # `$keep_upstream`, which is why this is a filter rather than an absence.
      #
      # `NGINX_LOCAL_RESOLVERS` is computed by the image's `15-local-resolvers.envsh` from the
      # container's `/etc/resolv.conf`, and the template uses it for the resolver that finds `keep`.
      # **It was a hardcoded `127.0.0.11`** — right on a user-defined network, wrong on the default
      # bridge, and wrong silently: `/api/` 502s while the whole site keeps working.
      NGINX_ENVSUBST_FILTER: "^(KEEP_|NGINX_LOCAL_RESOLVERS)"
      # ⚠️ Without this the script above returns immediately and the variable is never exported, so the
      # template would keep a literal `${NGINX_LOCAL_RESOLVERS}` and nginx would refuse to start.
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"

    volumes:
      # ⚠️⚠️⚠️ **The public path is a volume, not what the image baked.** The image carries the
      # development tree — two packages dated 2026-09-02, fixed on purpose so a committed tree does not
      # go stale. **Production's public path is whatever the rotation last wrote**, and mounting over it
      # is what makes the image's copy irrelevant rather than a thing that can be served by accident.
      #
      # ⬜ **Nothing writes this yet.** `publish` does the rotation and needs a scheduler; that is F3 and
      # is deliberately not invented here.
      #
      # ⚠️⚠️ **This said the volume would be empty until the rotation ran, and that is false.** Docker
      # populates a NEW named volume from the image's contents on first mount, so the first deploy came
      # up serving the image's development tree: two packages and two pointers dated **2026-09-02**,
      # confirmed on the VPS 2026-08-24. The sentence was written from what the mount was *for* rather
      # than from what Docker does, and it survived a review because it sounded like a limitation.
      #
      # ⚠️⚠️ **What follows from it is the thing to act on: the site serves a fixed future-dated puzzle
      # until F3's rotation runs, and it does so while looking perfectly healthy.** There is no empty
      # directory for the inventory health check to complain about — the failure it was built to catch
      # is exactly the one this hides. **A player arriving before the rotation gets the same board every
      # day**, which is worse than an outage because nothing reports it.
      - puzzles:/srv/serve/data/puzzles

    ports:
      # ⚠️⚠️ **Bound to loopback, because the VPS already runs an nginx** (`docs/beta-0.md`) and that one
      # terminates TLS and proxies here. Publishing on every interface would put this container on the
      # internet beside the reverse proxy that is supposed to be in front of it, on plain HTTP.
      #
      # ⚠️⚠️ **3005 on the host, 8080 inside.** The VPS's loopback already holds 3001 sabertables,
      # 3002 sixdegrees, 3003 the MLB proxy, 3004 dglweb, 5050 pgAdmin, 8081 revive and 9000/9443
      # Portainer. **8080 was the first choice and it is one digit from revive's 8081** -- close enough
      # that a typo in the host's `proxy_pass` reaches somebody else's ad server and answers, which is
      # worse than not answering. The 300x range is where this VPS puts its sites.
      #
      # ⚠️ The host's nginx needs `proxy_pass http://127.0.0.1:3005;` and nothing else: the routes, the
      # cache headers and the `/api/` block all live in this container's config, which is the one place
      # `forge/tests/` checks them. **Putting any of them in the host block would be a second copy.**
      - "127.0.0.1:3005:8080"

    depends_on:
      keep:
        condition: service_started

    # ⚠️ **Belt to the image's braces.** `worker_rlimit_nofile` in the image raises nginx's own soft
    # limit and is what actually acts; this raises the container's, so the two cannot disagree and a
    # future value above 8192 is not silently capped by a limit nobody looked at. The stock soft limit
    # is 1024, which the startup log prints on every boot.
    ulimits:
      nofile:
        soft: 16384
        hard: 16384

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

    networks: [backend]

  # The data layer. **Its port is never published** — that is the first line of defence and the token is
  # the second (`docs/data-layer.md` §4).
  keep:
    # Same as `serve`: loaded, never built here.
    #
    # ⚠️ **Its own version, independent of `serve`'s.** Most changes touch one image; rebuilding the
    # other to bump a shared number is work that changes nothing. What they share is two `/api/` routes
    # and a bearer token, and when that moves both versions move -- a decision to take rather than a
    # coupling to enforce in this file.
    image: bxcpze-keep:${BXCPZE_KEEP_VERSION:?the version that was loaded, e.g. 1.2026.1}
    container_name: bxcpze-keep
    restart: unless-stopped
    init: true

    environment:
      # ⚠️ Both `:?` for the same reason. `keep` also refuses to start without either, so this is the
      # second of two refusals rather than the only one — the container would not come up regardless,
      # and compose failing first says why in one line instead of in a traceback.
      KEEP_SHARED_TOKEN: ${KEEP_SHARED_TOKEN:?set it in the stack's environment; there is no default}
      # ⚠️⚠️ **Points at the Postgres that already exists**, which is a container: `postgres-postgres-1`,
      # on the `backend` network, with **5432 unpublished** (`docker ps`, 2026-08-24). So the host is the
      # container's name and the route is the network below — not `host.docker.internal`, which was the
      # other branch this file carried while nobody had looked.
      #
      #     postgresql://<user>:<password>@postgres-postgres-1:5432/bxcpze_keep
      #
      # ⚠️⚠️ **`bxcpze_keep`, not `keep`. The VPS's Postgres is shared** with dglweb, sabertables,
      # sixdegrees and revive, so a database called `keep` claims a generic name in somebody else's
      # instance. The `bxcpze` prefix is the same one every image, container and network carries; it
      # was declared once for Docker names and **the category was not enumerated**, which is how the
      # database came within one command of being created without it. Underscore rather than hyphen:
      # a hyphen in a Postgres identifier requires double quotes at every use, for ever.
      #
      # ⚠️ **The database and its credentials are still not guessed here.** The URL is supplied with the
      # stack; what is settled is its *shape*, because the shape follows from where Postgres actually runs.
      KEEP_DATABASE_URL: ${KEEP_DATABASE_URL:?e.g. postgresql://user:pass@postgres-postgres-1:5432/bxcpze_keep}

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

    networks: [backend]

  # The rotation's scheduler. **F3.**
  #
  # ⚠️⚠️ **Its own, not the `dglweb-scheduler` already on this VPS.** That one belongs to dglweb, and
  # hanging this rotation off it would mean that the day that stack is redeployed or removed **the
  # puzzle stops changing and nothing says so** -- a coupling between two products that share only a
  # host. §33's argument about trees, one level up.
  #
  # ⚠️ **There is no `publish` service here.** The job creates its own container from
  # `bxcpze-publish` and deletes it afterwards; a service would be a container that exits by design,
  # which reads in `docker ps` exactly like one that keeps crashing. `deploy/ofelia/rotation.ini` is
  # the whole definition.
  scheduler:
    # Pinned by digest, the operator's own convention for this image.
    image: mcuadros/ofelia@sha256:efcbe2c5cf658a25de6443c1462d653f9cc03791d642e01fc6c638a00f97e492
    container_name: bxcpze-scheduler
    restart: unless-stopped
    command: daemon --config=/etc/ofelia/config.ini

    environment:
      # ⚠️⚠️ **UTC, deliberately, and not the host's zone.** `serving_date()` is UTC-based -- the day
      # changes at 08:00 UTC -- so writing the schedule in any other clock would mean the schedule and
      # the thing it triggers are in two zones, and every future reader has to convert one to check the
      # other. `rotation.ini` carries the reasoning.
      TZ: UTC

    volumes:
      # ⚠️⚠️ **Read-only, and it is still the largest privilege in this stack.** Anything that can talk
      # to the Docker socket can start a container as root on the host. It is here because that is how
      # ofelia runs a job in another container at all, and it is why this scheduler is a small thing
      # with one job rather than something with more in it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/boxscorepuzzle/ofelia/config.ini:/etc/ofelia/config.ini:ro

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

    networks: [backend]

networks:
  # ⚠️⚠️ **One network, and it is the VPS's existing `backend`** — the same one dglweb, sabertables,
  # sixdegrees, revive and pgadmin are on, and the one `postgres-postgres-1` is on. `serve` reaches
  # `keep` by name here, and `keep` reaches Postgres by name.
  #
  # ⚠️⚠️ **This replaced an `edge` + `inside` pair, and the reason is worth keeping because the pair
  # looked correct.** `inside` was `internal: true` and carried the argument that *the port is not
  # published* was a property of the network rather than a convention. **That was true while `keep` was
  # only on `inside`.** Joining `backend` so `keep` could reach Postgres made it false without
  # contradicting anything: every container on `backend` can reach `keep` either way, so the internal
  # network restricted nothing and only added a second path between two services already able to talk.
  # `edge` existed solely because an internal network blocks published ports, so it went with it.
  #
  # **A justification is scoped and does not travel.** The comment stayed true-sounding for hours after
  # the thing it described had stopped being the case.
  #
  # ⚠️ **What actually keeps `keep` private is unchanged and is not this file's networks:** it publishes
  # no port, and it refuses every request without the shared token (`docs/data-layer.md`). Those are the
  # first and second lines of defence, and they always were.
  #
  # ⚠️ `external: true` means compose **fails** when `backend` is absent rather than quietly creating an
  # empty network of the same name and leaving both services unable to resolve anything — the absence of
  # the route reading as the route being there.
  backend:
    external: true

volumes:
  # ⚠️ Named, so it survives `docker compose down` and a redeploy. What is in it is two public packages
  # and two dated pointers; the private inventory never comes near this host path.
  puzzles:
