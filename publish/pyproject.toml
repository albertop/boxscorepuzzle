[project]
name = "publish"
version = "0.1.0"
description = "The serving side's executables: the daily rotation now, the health endpoints and the archive endpoint later."
requires-python = "==3.13.*"
# No runtime dependencies, the same shape keep proved. The rotation copies two files, deletes one and
# writes a small JSON document -- stdlib does all of it, and a dependency on the VPS is a thing that can
# fail at three in the morning for a reason nobody on this project chose.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/publish"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# ⚠️⚠️ `"."` as well as `"src"`, so `tests.conftest` imports the same way under `pytest` and under
# `python -m pytest`. Without it the two differ: `python -m` puts the working directory on sys.path and
# plain `pytest` does not -- so a suite verified one way passed while the pre-push hook, which runs the
# other, refused the push. The environment belongs in configuration rather than in how it was invoked.
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "SIM", "RUF", "S", "T20", "TRY", "EM", "RET", "PTH", "FBT", "PL", "ARG"]

[tool.ruff.lint.per-file-ignores]
# S101 is pytest's assert. PLR2004 is a magic number in a test, where the number is the subject.
"tests/**" = ["S101", "PLR2004"]
# ⚠️ T201 is `print`, and this module's entire job is talking to a terminal: it is the command the
# daily job runs, and a step whose success looks like silence is a step nobody can tell failed
# (`docs/beta-0-plan.md` A5.2). The ban is right everywhere else in `src/` -- a library that prints is
# a library that cannot be used -- so it is lifted here by name rather than switched off.
"src/publish/__main__.py" = ["T201"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
