# The dev server in a container, so the board is reachable from a phone on the same wireless network.
#
#     docker compose up -d
#
# ⚠️ **No image is built and there is nothing to rebuild.** The official Python image runs
# `tools/dev_server.py` against a mounted `serve/`, so an edit on the laptop is live on the phone at
# the next reload. A `Dockerfile` here would buy nothing and cost a rebuild per edit.
#
# ⚠️ **No nginx and no production shape.** This is the development environment on a Windows laptop
# running Docker Desktop, and that is all it is. The service's real caching contract — the dated
# pointers never cached, the packages cached for a year because they are immutable — is the table in
# `docs/calendar.md`, which E3 implements and nothing enforces yet. `dev_server.py` caches nothing at
# all, which is the correct blunt answer for a tree being edited every few seconds and is the
# **opposite** shape to production.
#
# ⚠⚠ **This named `manifest.json` and `<generation>/<id>.json` until 2026-08-24, and since E1 the
# public path holds neither.** It is flat: `today.json`, `yesterday.json` and `<id>.json`. The rule did
# not change with the names because it was never about them — what makes a document cacheable is
# whether it can change — but a rule stated against files that do not exist is what somebody
# implements.

services:
  serve:
    image: python:3.13-alpine
    container_name: bxcpze-serve-dev
    working_dir: /app
    # ⚠️ **`init: true`, so something reaps signals.** (v36-P3-43) The exec-form command makes CPython
    # PID 1, `dev_server.py` installs no SIGTERM handler, and PID 1 gets no default signal
    # dispositions — so `docker compose stop` sent SIGTERM, nothing happened, and the runtime SIGKILLed
    # after the grace period: a ten-second stall on every stop. Cosmetic in development, and **a server
    # that ignores SIGTERM is the kind of shape that silently becomes the production path**.
    init: true
    command: ["python", "tools/dev_server.py", "8080"]

    # ⚠️ **Read-only mounts.** The server only ever reads, and the laptop's tree is the source of
    # truth: a container that could write into `serve/` is one that can silently disagree with git.
    volumes:
      - ./serve:/app/serve:ro
      - ./tools:/app/tools:ro

    # ⚠️ **`0.0.0.0` on the host side, which is what puts the board on the phone.** Docker Desktop
    # publishes to every interface on the laptop, so the address to type into a phone is the laptop's
    # own address on the wireless network — not localhost.
    #
    # ⚠️⚠️ **This claimed 8137 is also what the browser tooling uses, "so there is one address and one
    # server rather than two that can drift". It is the opposite.** (v36-P3-44)
    # `tools/run_browser_tests.py` picks a *free* port deliberately, and its docstring says why: sharing
    # 8137 would let the suite silently test the **container's mounted copy** instead of the working
    # tree. Two files asserting opposite facts about one decision, and someone "restoring" the sharing
    # on the strength of this comment would reintroduce the exact hazard the tool exists to avoid.
    ports:
      - "0.0.0.0:8137:8080"

    # ⚠️⚠️ **`no`, not `unless-stopped`.** (v36-P3-31) The all-interfaces publish above is deliberate —
    # it is what puts the board on a phone — but combined with `unless-stopped` the container
    # **auto-started with Docker Desktop on every boot, indefinitely, including on public Wi-Fi**,
    # serving the whole `serve/` tree through a stdlib handler with directory listings.
    #
    # That interaction was written down nowhere. What it serves is low value today (`forge/` is not
    # mounted; the mounts are `./serve` and `./tools`, read-only) and the standing exposure is the
    # point rather than the payload. `docker compose up` when the board is wanted on a handset is one
    # command; a listener on every network the laptop joins is not something to acquire by default.
    restart: "no"
