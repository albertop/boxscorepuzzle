# The suite on every push, so `main` is deployable because it was checked rather than because a
# document says so.
#
# ⚠️⚠️ **CLAUDE.md has claimed "`main` always deployable, protected, CI must pass" since the first
# commit, and none of it was true — there was no `.github/` at all.** The document that defines this
# project's rules was asserting a guarantee it did not have, which is the same shape being closed in
# the code all week, sitting in the file the rules come from.
#
# What runs, and why each one is here rather than trusted:
#
#   - **ruff over `forge/`, blocking.** It is at zero and it stays at zero.
#   - **the `discovery/` ratchet.** 199 findings that have never been reported once, because ruff's
#     config included that tree and no invocation ever pointed at it. See `tools/lint_discovery.py`.
#   - **mypy strict**, which is what the type annotations are for.
#   - **pytest with the coverage floor**, taken from `pyproject.toml` so the number lives in one place.
#   - **the browser suite**, headless, because half the client's contract is the cascade and the DOM.

name: CI

# ⚠️⚠️ **`main` and pull requests, not every push to every branch.** Measured before cutting: 44 runs
# over six days, 130 billed minutes a day against a 2,000-minute monthly allowance. Every one of those
# 44 was a push to `main` — there are no branches and no pull requests today — so this saves nothing
# **now**. It is the shape that keeps a working branch from costing a full CI run per save later.
on:
  push:
    branches: [main]
    # ⚠️ **`paths-ignore` lists what cannot affect the code, and that direction is the point.** A
    # `paths` list naming what *does* affect it forgets the next directory somebody adds, and forgets
    # it silently — the new code simply never runs. This way an unlisted path runs CI by default and
    # the failure mode is a wasted run rather than an unchecked one.
    #
    # Six of 43 measured pushes changed nothing but documents. Measured per **push** rather than per
    # commit on purpose: a push carrying twenty commits, one of which touches `forge/`, needs the
    # suite — counting commits put the docs-only share at 17% instead of 14%.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# A second push supersedes the first; a queue of stale runs teaches people to ignore the badge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ⚠️ **Actions pinned by commit, not by tag.** (v36-P3-30) `@v4` and `@v5` are mutable references: the
# code they resolve to can change without this file changing. `permissions: contents: read` is already
# minimal and no secrets are referenced, so the entire supply-chain risk here is **exfiltration of the
# checked-out `forge/`** — which is the one asset that keeps this repository private permanently (§16).
# Low likelihood, high asymmetry, one line each.
permissions:
  contents: read

jobs:
  forge:
    # ⚠️⚠️ **Ubuntu only since 2026-08-22, and this ran on both.** Operator's decision, unconditional:
    # **this is never deployed on Windows.** Measured before cutting — over six days the Windows job was
    # 302 of 778 billed minutes, **39%**, against a free allowance the repository was running at roughly
    # twice over.
    #
    # ⚠️ **39%, not the two thirds the doubled rate suggests.** Windows minutes bill at 2×, so the
    # arithmetic only reaches two thirds if the suite takes the same wall time on both. It does not:
    # this job ran **3.5 minutes on Windows against 9.5 on Linux**, because Linux also runs the
    # coverage pass. The multiplier was working against a much shorter job.
    #
    # ⚠️⚠️ **What the old note said Windows was for, and why removing it is not the loss it reads as.**
    # It said: *the laptop is Windows, a redirected stream there is cp1252, and this project has already
    # lost three hours of compute to a report dying on a character it printed.* All true, and that class
    # of defect appeared **twice more on 2026-08-22**.
    #
    # **Both were caught without this job.** `forge/tests/test_reports_survive_a_redirected_stream.py`
    # is a static check over every `print` argument and runs on any platform — it is what turned red for
    # a warning sign in a `print`, on the pre-push hook, on the laptop. And the laptop *is* the Windows
    # machine: the hook runs the whole suite there before every push, so the platform that needed
    # covering is the one the developer already uses. **This job was re-running Windows for a project
    # whose only Windows machine had just run it.**
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # pyodbc builds against unixODBC. Nothing in the test suite opens a connection — `load()` imports
      # pyodbc lazily and only the discovery scripts call it — but the package still has to install.
      - name: ODBC headers
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
        working-directory: .

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true

      # ⚠️ `--frozen`, so the lockfile is the thing being tested. `uv.lock` is committed as the
      # reproducibility guarantee; a CI run that silently resolved something newer would be testing a
      # dependency set that exists nowhere else.
      - name: Install
        run: uv sync --frozen --group dev

      - name: Lint the forge
        run: uv run ruff check src scripts tests

      # ⚠️ Mandated by docs/python-conventions.md and run nowhere until v36-P3-01. A documented check
      # that does not exist is the shape the CI section of CLAUDE.md was rewritten to close.
      - name: Format the forge
        run: uv run ruff format --check src scripts tests

      - name: Lint discovery and tools, against the baseline
        run: uv run python ../tools/lint_discovery.py

      - name: Types
        run: uv run mypy src

      # The floor is `fail_under = 95` in pyproject.toml. Not repeated here: a threshold spelled in two
      # places is two thresholds.
      - name: Tests and coverage
        run: uv run pytest --cov --cov-report=term-missing

  browser:
    # The engine's tests assert computed styles, element geometry and the cascade, so they need a real
    # browser. `tools/run_browser_tests.py` drives the same page a person opens and fails closed on
    # every way of not finishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: ODBC headers
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --group dev
        working-directory: forge

      - name: Chromium
        run: uv run playwright install --with-deps chromium
        working-directory: forge

      - name: Browser suite
        run: uv run python ../tools/run_browser_tests.py
        working-directory: forge
