<title>Board prototype</title>
<style>
  /* A measuring instrument. Nothing here is a design decision: every value present is one the
     measurement needs — the 44px touch target, the label width, the keypad height. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font: 13px/1.1 -apple-system, "Segoe UI", system-ui, sans-serif;
         display: flex; flex-direction: column; overflow: hidden; background: #fff; color: #111; }

  /* Scaffolding. Hidden by default so a screenshot shows what the player sees — the game id alone
     is a spoiler, since it carries the teams and the date that section 7 withholds until the end. */
  #rig { display: none; padding: 2px 4px; font-size: 11px; background: #eee; flex: 0 0 auto; }
  body.rig #rig { display: block; }

  #reveal { flex: 0 0 auto; font-size: 12px; padding: 4px 6px; background: #f6f6f6;
            border-bottom: 1px solid #ccc; min-height: 22px; }

  /* The line score is the anchor and must be complete — twelve columns, both teams. It needs no
     touch target, so it renders small enough to fit. */
  #linescore { flex: 0 0 auto; width: 100%; border-collapse: collapse; font-size: 9px; }
  #linescore td, #linescore th { border: 1px solid #ddd; padding: 0 1px; text-align: right; height: 15px; }
  #linescore th.side, #linescore td.side { text-align: left; width: 38px; font-weight: 700; }
  #linescore tr.ours { background: #eef4ff; }

  #footnotes { flex: 0 0 auto; font-size: 11px; padding: 3px 6px; border-bottom: 1px solid #ccc; }

  /* One continuous board. Batting above, pitching below, scrolled between like any document —
     no toggle, no mode, nothing hidden. */
  #scroller { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; min-height: 0; position: relative; }
  table.grid { border-collapse: collapse; width: 100%; table-layout: fixed; }
  table.grid th, table.grid td { text-align: right; padding: 0; border: 1px solid #ccc;
                                 font-variant-numeric: tabular-nums; }
  th.label, td.label { text-align: left; width: 62px; padding-left: 3px; font-size: 11px;
                       overflow: hidden; white-space: nowrap; }
  td.cell, th.col { width: calc((100% - 62px) / 6); }
  td.cell { height: 44px; font-size: 15px; padding-right: 5px; }
  td.cell.blank { background: #f4f4f4; }
  td.cell.selected { outline: 2px solid #06c; outline-offset: -2px; }
  thead th { position: sticky; top: 0; z-index: 2; background: #ddd; height: 22px; font-size: 11px; }
  tr.section td { background: #333; color: #fff; font-size: 10px; text-align: left;
                  padding-left: 4px; height: 16px; letter-spacing: .05em; }
  tr.totals td { background: #ddd; font-weight: 700; height: 34px; }

  /* Contextual anchoring: the totals of the section currently in view, pinned. Not a mode — the
     player never chooses it and should not notice it as an action. */
  #anchor { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
            background: #ddd; border-top: 2px solid #999; }

  #keypad { flex: 0 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px;
            padding: 4px; background: #e8e8e8; }
  #keypad button { height: 48px; font-size: 18px; border: 1px solid #bbb; background: #fff; }
</style>
</head>

<table id="linescore"></table>

<div id="scroller"><table class="grid" id="grid"></table><table class="grid" id="anchor"></table></div>

const BAT = ["PA","AB","R","H","BB","K"], PIT = ["IP","H","R","ER","BB","K"];
let board, selected = null, solvedRows = 4;

function lineScore(b) {
  const n = Math.max(b.lineScore.offense.length, b.lineScore.defense.length);
  const head = "<tr><th class='side'></th>" +
    Array.from({length: n}, (_, i) => "<th>" + (i + 1) + "</th>").join("") +
    "<th>R</th><th>H</th><th>E</th></tr>";
  // AWAY and HOME, because both teams batted and both fielded — offence and defence do not name
  // the rows of a line score. The batting section's team is tinted so the player can connect them.
  const row = (side, innings, rhe, ours) =>
    "<tr class='" + (ours ? "ours" : "") + "'><td class='side'>" + side + "</td>" +
    Array.from({length: n}, (_, i) => "<td>" + (innings[i] ?? "x") + "</td>").join("") +
    rhe.map(v => "<td><b>" + v + "</b></td>").join("") + "</tr>";
  const weAreHome = b.offenseIsHome;
  return head +
    row("AWAY", weAreHome ? b.lineScore.defense : b.lineScore.offense,
        weAreHome ? b.lineScore.defenseRHE : b.lineScore.offenseRHE, !weAreHome) +
    row("HOME", weAreHome ? b.lineScore.offense : b.lineScore.defense,
        weAreHome ? b.lineScore.offenseRHE : b.lineScore.defenseRHE, weAreHome);
}

function label(b, r) {
  // The revealed name replaces the position in the row label. It costs no pixels and it sits where
  // the player expects the row's identity, so nine names accumulate as a free progress bar.
  return r < solvedRows && b.revealed[r] ? b.revealed[r] : b.labels[r];
}

function grid(b) {
  const head = h => "<tr><th class='label'></th>" + h.map(x => "<th class='col'>" + x + "</th>").join("") + "</tr>";
  const cells = (vals, blanks) => vals.map((v, i) =>
    "<td class='cell" + (blanks.includes(i) ? " blank" : "") + "' tabindex='0'>" +
    (blanks.includes(i) ? "" : v) + "</td>").join("");

  let html = "<thead>" + head(BAT) + "</thead><tbody>";
  html += "<tr class='section'><td colspan='7'>BATTING</td></tr>";
  b.batting.forEach((row, r) => {
    html += "<tr><th class='label'>" + label(b, r) + "</th>" + cells(row, [(r * 2) % 6, (r * 3 + 1) % 6]) + "</tr>";
  });
  html += "<tr class='totals' id='batTotals'><td class='label'>TOTALS</td>" +
    b.battingTotals.map(v => "<td class='cell'>" + v + "</td>").join("") + "</tr>";
  html += "<tr class='section'><td colspan='7'>PITCHING</td></tr>";
  html += "<tr><th class='label'></th>" + PIT.map(x => "<th class='col' style='font-size:11px'>" + x + "</th>").join("") + "</tr>";
  b.pitching.forEach((row, r) => {
    html += "<tr><th class='label'>P" + (r + 1) + "</th>" + cells(row, [(r + 2) % 6]) + "</tr>";
  });
  html += "<tr class='totals' id='pitTotals'><td class='label'>TOTALS</td>" +
    b.pitchingTotals.map(v => "<td class='cell'>" + v + "</td>").join("") + "</tr></tbody>";
  return html;
}

/* Hand the anchor to whichever section the player is looking at. */
function updateAnchor() {
  const scroller = document.getElementById("scroller");
  const batTotals = document.getElementById("batTotals");
  const midpoint = scroller.scrollTop + scroller.clientHeight / 2;
  const inPitching = midpoint > batTotals.offsetTop + batTotals.offsetHeight;
  const source = inPitching ? document.getElementById("pitTotals") : batTotals;
  const heads = inPitching ? PIT : BAT;
  document.getElementById("anchor").innerHTML =
    "<tr class='totals'>" + source.innerHTML + "</tr>";
  document.getElementById("anchor").style.display =
    source.getBoundingClientRect().bottom <= scroller.getBoundingClientRect().bottom ? "none" : "table";
  void heads;
}

function render() {
  document.getElementById("linescore").innerHTML = lineScore(board);
  document.getElementById("footnotes").textContent = board.footnotes.join("    ");
  document.getElementById("grid").innerHTML = grid(board);
  document.getElementById("reveal").textContent =
    solvedRows + " of " + board.batting.length + " rows complete";
  document.querySelectorAll("td.cell.blank").forEach(td =>
    td.addEventListener("click", () => {
      document.querySelectorAll("td.cell.selected").forEach(x => x.classList.remove("selected"));
      td.classList.add("selected"); selected = td;
    }));
  updateAnchor();
  measure();
}

function measure() {
  const px = el => Math.round(el.getBoundingClientRect().height);
  const scroller = document.getElementById("scroller");
  const labels = [...document.querySelectorAll("#grid th.label")];
  const parts = {
    viewport: window.innerHeight,
    keypad: px(document.getElementById("keypad")),
    reveal: px(document.getElementById("reveal")),
    linescore: px(document.getElementById("linescore")),
    footnotes: px(document.getElementById("footnotes")),
    header: px(document.querySelector("#grid thead th")),
    sectionBar: px(document.querySelector("#grid tr.section td")),
    anchor: px(document.getElementById("batTotals")),
    scrollerVisible: px(scroller),
    cellHeight: px(document.querySelector("#grid td.cell")),
    dataColWidth: Math.round(document.querySelector("#grid td.cell").getBoundingClientRect().width),
    labelWidth: Math.round(document.querySelector("#grid th.label").getBoundingClientRect().width),
    lineScoreFits: document.getElementById("linescore").scrollWidth <= document.getElementById("linescore").clientWidth,
    lineScoreColumns: document.querySelectorAll("#linescore tr:first-child th").length,
    labelsClipped: labels.filter(e => e.scrollWidth > e.clientWidth + 1).map(e => e.textContent),
  };
  parts.rowsVisibleAtOnce = Math.floor((parts.scrollerVisible - parts.header - parts.anchor) / parts.cellHeight);
  window.MEASUREMENT = parts;
  document.getElementById("readout").textContent =
    ` ${parts.rowsVisibleAtOnce} rows | col ${parts.dataColWidth}px | linescore fits ${parts.lineScoreFits}`;
}

const pick = document.getElementById("pick");
BOARDS.forEach((b, i) => pick.add(new Option(`${b.id} — ${b.note}`, i)));
pick.addEventListener("change", () => { board = BOARDS[pick.value]; render(); });
"0123456789".split("").forEach(d => {
  const btn = document.createElement("button"); btn.textContent = d;
  btn.onclick = () => { if (selected) selected.textContent = d; };
  document.getElementById("keypad").appendChild(btn);
});
document.getElementById("scroller").addEventListener("scroll", updateAnchor);
window.addEventListener("resize", measure);
board = BOARDS[0];
render();
</script>
