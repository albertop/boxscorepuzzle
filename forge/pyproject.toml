[project]
name = "boxscore-forge"
version = "0.1.0"
description = "Puzzle generation, validation and calendar construction. Never leaves the laptop."
requires-python = "==3.13.*"
dependencies = [
    "pyodbc>=5.3.0",
    # Ed25519. The signature has to prove the package came from the forge, and a MAC cannot say that:
    # every verifier of an HMAC is also a signer, so the verification key on the VPS *is* the signing
    # authority (§33). Asymmetric signing is the fix, and there is no Ed25519 in the standard library.
    "cryptography>=44.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "hypothesis>=6",
    "mypy>=1.13",
    "ruff>=0.8",
    "reportlab>=5.0.0",
    "playwright>=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Three packages, and the separation between them is a design requirement rather than tidiness.
# `boxscore_forge` generates; `boxscore_verify` judges what it produced and shares no code with it
# (§22); `boxscore_package` is the file format, which both genuinely need and neither owns.
# `boxscore_domain` is the fourth and holds no code at all: the decided values of the domain, with
# the reason and the measurement beside each one. Same argument as `boxscore_package` — both sides
# genuinely need it and neither owns it — and being data rather than logic, §22's independence
# between generator and verifier is untouched by both importing it.
packages = ["src/boxscore_forge", "src/boxscore_verify", "src/boxscore_package", "src/boxscore_domain"]

[tool.ruff]
# Discovery is linted too. The duplicate `audit()` that disabled a launch-gate check lived there,
# outside the lint scope, so the rule that catches it could not see the file.
extend-include = ["../discovery/**/*.py"]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "W",    # pycodestyle, pyflakes
    "I",              # isort
    "N",              # pep8-naming
    "UP",             # pyupgrade — catches legacy typing imports
    "ANN",            # type annotations on public interfaces
    "B",              # bugbear
    "SIM",            # simplify
    "RUF",            # ruff-specific
    "S",              # bandit — security
    "T20",            # no print()
    "G",              # no f-strings in logging calls
    "LOG",            # logging misuse
    "TRY",            # exception antipatterns
    "EM",             # exception messages not inline literals
    "RET",            # return simplification
    "ERA",            # commented-out code
    "DTZ",            # naive datetime
    "PTH",            # pathlib over os.path
    "FBT",            # boolean trap
    "C4",             # comprehensions
    "ARG",            # unused arguments
    "PL",             # pylint subset
    "ISC",            # implicit string concat
]

[tool.ruff.lint.per-file-ignores]
# Runnable scripts print: that is their interface. And the name of an environment variable is not a
# secret, whatever it looks like to a pattern matcher.
"scripts/*.py" = ["T201", "S105"]
# ⚠️ `extend-include` pulls `../discovery` into ruff's scope and nothing here exempted it, so every
# discovery script reported 25 unfixable findings for printing — its interface. A check that fires on
# everything carries no information, exactly like one that never fires.
"../discovery/**/*.py" = ["T201", "S105"]
"../tools/*.py" = ["T201"]   # a dev server that says nothing on start looks like one that did not start
"tests/**" = ["S101", "PLR2004"]
# ⚠️ S603/S607 are `subprocess` with a partial executable path, and ARG002 is a fixture a case takes
# only to inherit its skip. This one shells out to `docker` by name on purpose: the whole
# point is to use whatever container runtime the machine has, and an absolute path would be a second
# copy of a fact the operating system already holds. The argument list is fixed and no shell is used.
"tests/test_nginx_serves_what_is_declared.py" = ["S101", "PLR2004", "S603", "S607", "ARG002"]   # asserts and magic numbers are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers --strict-config --tb=short"
filterwarnings = ["error"]
# asyncio_mode is deliberately absent: the forge is CPU-bound batch work with no concurrent I/O,
# so pytest-asyncio would be a dependency carrying no weight. Add both together if that changes.

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# ⚠️ **pyodbc publishes no type stubs**, and that is a fact about the library rather than about the two
# lines that import it. Declared once here instead of as an inline ignore at each call site, which is
# the same rule the rest of this project applies to constants: the thing that is true in one place is
# stated in one place.
#
# ⚠️ It suppresses *the missing stub*, not the use. `_rows` and `load` still type-check against
# `Any`-typed cursors, which is why both return an explicitly annotated `list[Any]` rather than letting
# `Any` leak into a signature — `warn_return_any` is on and catches that.
[[tool.mypy.overrides]]
module = "pyodbc"
ignore_missing_imports = true
